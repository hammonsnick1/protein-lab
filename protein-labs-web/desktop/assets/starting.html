<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>Protein Lab</title>
  <style>
    html { color-scheme: light; background: #eee8dc; color: #24211c; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { text-align: center; padding: 2rem; }
    img { width: 100px; height: 100px; animation: breathe 3s ease-in-out infinite; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { color: #706655; }
    @keyframes breathe { 50% { transform: scale(1.06); opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body><main><img src="icon.png" alt=""><h1>Protein Lab</h1><p>Starting your local workspace…</p></main></body>
</html>
