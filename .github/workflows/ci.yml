# Runs the engine tests and the desktop checks on every pull request and on
# every push to main. Branch protection on main requires both jobs to pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: protein-labs/backend/requirements*.txt

      - name: Install
        working-directory: protein-labs/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test
        working-directory: protein-labs/backend
        run: python -m pytest tests -q

  desktop:
    name: Desktop checks
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: protein-labs-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: protein-labs-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Test
        run: npm test

      - name: Build
        run: npm run desktop:build:web
