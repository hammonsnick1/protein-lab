# Builds the Protein Lab installers on every OS and attaches them to a draft
# GitHub Release.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# The tag sets the app version, so it must be semver (vX.Y.Z or vX.Y.Z-rc.N).
# PyInstaller cannot cross-compile, so each runner builds its own engine;
# every engine and every installer is smoke-tested before anything is
# uploaded. A manual run (workflow_dispatch) builds and tests without
# releasing; its installers are kept as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the engine on glibc 2.35, so it also runs on Debian 12.
          - name: Linux x64
            os: ubuntu-22.04
            builder: --linux AppImage deb pacman --x64
          - name: Windows x64
            os: windows-latest
            builder: --win nsis --x64
          - name: macOS arm64
            os: macos-15
            builder: --mac dmg --arm64
          - name: macOS x64
            os: macos-15-intel
            builder: --mac dmg --x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: protein-labs/backend/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: protein-labs-web/package-lock.json

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: protein-labs-web
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Engine - install and test
        working-directory: protein-labs/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller
          python -m pytest tests -q

      - name: Engine - build
        working-directory: protein-labs/backend
        run: python -m PyInstaller --noconfirm --clean --log-level WARN protein-labs-backend.spec

      - name: Engine - smoke test
        run: |
          engine=protein-labs/backend/dist/protein-labs-backend
          [[ "$RUNNER_OS" == Windows ]] && engine+=.exe
          node protein-labs-web/scripts/smoke-engine.mjs "$engine"

      - name: Desktop - install dependencies
        working-directory: protein-labs-web
        run: npm ci

      - name: Desktop - lint and type-check
        if: runner.os == 'Linux'
        working-directory: protein-labs-web
        run: |
          npm run lint
          npx tsc --noEmit -p .

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools xvfb desktop-file-utils

      - name: Desktop - package
        working-directory: protein-labs-web
        run: |
          npm run desktop:build:web
          npx electron-builder --publish never ${{ matrix.builder }}

      - name: Smoke test - AppImage and .deb
        if: runner.os == 'Linux'
        working-directory: protein-labs-web
        run: |
          appimage=$(ls release/*.AppImage)
          chmod +x "$appimage"
          xvfb-run -a node scripts/smoke-app.mjs "$appimage" --no-sandbox
          sudo apt-get install -y ./release/*.deb
          desktop-file-validate /usr/share/applications/protein-labs.desktop
          xvfb-run -a node scripts/smoke-app.mjs /opt/Protein\ Lab/protein-labs --no-sandbox

      # PowerShell, because Git Bash rewrites the /S switch into the path S:/
      # and the installer then waits on its interactive wizard.
      - name: Install - Windows installer
        if: runner.os == 'Windows'
        working-directory: protein-labs-web
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }

      - name: Smoke test - Windows installer
        if: runner.os == 'Windows'
        working-directory: protein-labs-web
        timeout-minutes: 5
        run: |
          app=$(find "$(cygpath "$LOCALAPPDATA")/Programs" -name "Protein Lab.exe" -print -quit)
          echo "Installed: $app"
          node scripts/smoke-app.mjs "$app"

      - name: Smoke test - macOS disk image
        if: runner.os == 'macOS'
        working-directory: protein-labs-web
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" release/*.dmg
          cp -R "$RUNNER_TEMP/dmg/Protein Lab.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          codesign --verify --deep --verbose=2 "$RUNNER_TEMP/Protein Lab.app"
          node scripts/smoke-app.mjs "$RUNNER_TEMP/Protein Lab.app/Contents/MacOS/Protein Lab"

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            protein-labs-web/release/*.AppImage
            protein-labs-web/release/*.deb
            protein-labs-web/release/*.pkg.tar.zst
            protein-labs-web/release/*.exe
            protein-labs-web/release/*.dmg
          if-no-files-found: error

  # Arch and Omarchy: install the pacman package with its declared
  # dependencies in a clean Arch container, then launch it.
  smoke-arch:
    name: Arch Linux package
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: installers-Linux-X64
          path: release
      - name: Install the package
        run: |
          pacman -Syu --noconfirm --needed nodejs xorg-server-xvfb
          pacman -U --noconfirm release/*.pkg.tar.zst
          pacman -Qi protein-labs
      - name: Smoke test
        # Containers run as root, which Chromium only allows unsandboxed.
        run: xvfb-run -a node protein-labs-web/scripts/smoke-app.mjs /usr/bin/protein-labs --no-sandbox

  release:
    name: Draft release
    needs: [build, smoke-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
            gh release create "$GITHUB_REF_NAME" release/* --draft $prerelease \
              --title "Protein Lab ${GITHUB_REF_NAME#v}" \
              --notes-file protein-labs-web/docs/release-notes.md
          fi
